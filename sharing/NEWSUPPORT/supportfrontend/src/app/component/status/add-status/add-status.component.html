<div class="modal fade" id="addStatusModal" tabindex="-1" aria-labelledby="addStatusModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="addStatusModalLabel">{{ isEditMode ? 'Edit Status' : 'Add New Status' }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>
      
      <div class="modal-body">
        <form (ngSubmit)="addStatus()" #statusForm="ngForm">
          <div class="form-group">
            <label for="StatusName" class="form-label">Status Name</label>
            <input
              type="text"
              class="form-control"
              id="StatusName"
              name="StatusName"
              [(ngModel)]="newStatus.StatusName"
              required
              #name="ngModel"
            />
            <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-danger">
              <small *ngIf="name.errors?.['required']">Status is required.</small>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" [disabled]="statusForm.invalid">
            {{ isEditMode ? 'Update Status' : 'Add Status' }} 
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
