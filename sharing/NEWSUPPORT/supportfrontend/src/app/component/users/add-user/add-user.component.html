<!-- Modal HTML -->

<div
  class="modal-backdrop fade show"
  *ngIf="showModal"
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1040;
  "
></div>

<div
  class="modal fade show d-block"
  *ngIf="showModal"
  tabindex="-1"
  style="background: rgba(0, 0, 0, 0.3); z-index: 1050"
  role="dialog"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          {{ isEditMode ? "Edit User" : "Add New User" }}
        </h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <form #userForm="ngForm" (ngSubmit)="addUser()" novalidate>
          <div class="mb-3">
            <label for="userName" class="form-label">Name</label>
            <input
              type="text"
              class="form-control"
              id="userName"
              [(ngModel)]="newUser.name"
              name="name"
              required
              #name="ngModel"
            />
            <div
              *ngIf="name.invalid && (name.dirty || name.touched)"
              class="text-danger"
            >
              <small *ngIf="name.errors?.['required']">Name is required.</small>
            </div>
          </div>

          <div class="mb-3">
            <label for="userMobile" class="form-label">Mobile</label>
            <input
              type="text"
              class="form-control"
              id="userMobile"
              [(ngModel)]="newUser.mobile"
              name="mobile"
              required
              pattern="^[0-9]+$"
              minlength="10"
              maxlength="12"
              #mobile="ngModel"
            />
            <div
              *ngIf="mobile.invalid && (mobile.dirty || mobile.touched)"
              class="text-danger"
            >
              <small *ngIf="mobile.errors?.['required']"
                >Mobile is required.</small
              >
              <small *ngIf="mobile.errors?.['pattern']"
                >Mobile must be numeric.</small
              >
              <small *ngIf="mobile.errors?.['minlength']"
                >Minimum 10 digits.</small
              >
              <small *ngIf="mobile.errors?.['maxlength']"
                >Maximum 12 digits.</small
              >
            </div>
          </div>

          <div class="mb-3">
            <label for="userEmail" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="userEmail"
              [(ngModel)]="newUser.email"
              name="email"
              required
              email
              #email="ngModel"
            />
            <div
              *ngIf="email.invalid && (email.dirty || email.touched)"
              class="text-danger"
            >
              <small *ngIf="email.errors?.['required']"
                >Email is required.</small
              >
              <small *ngIf="email.errors?.['email']"
                >Please enter a valid email address.</small
              >
            </div>
          </div>

          <div class="mb-3">
            <label for="useraddresh" class="form-label">Address</label>
            <input
              type="text"
              class="form-control"
              id="useraddresh"
              [(ngModel)]="newUser.addresh"
              name="addresh"
              required
              #addresh="ngModel"
            />
            <div
              *ngIf="addresh.invalid && (addresh.dirty || addresh.touched)"
              class="text-danger"
            >
              <small *ngIf="addresh.errors?.['required']"
                >Address is required.</small
              >
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="userForm.invalid"
          >
            {{ isEditMode ? "Update User" : "Add User" }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
