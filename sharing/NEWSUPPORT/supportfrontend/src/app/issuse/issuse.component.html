  <div class="issues_card">
  <div class="search-wrapper">
    <!-- <h1 class="heading_title">Issues</h1> -->
    <div d-flex justify-content-end align-items-center gap-2 mb-3>
      <input type="text" class="search-input" placeholder="Search by name, status" [(ngModel)]="searchTerm"
        (input)="onSearch(searchTerm)" />
    </div>


    <div>
      <button type="button" class="btn btn-primary" (click)="openOffcanvas()" class="btn">
        <svg width="25px" height="25px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M21 6H19M21 12H16M21 18H16M7 20V13.5612C7 13.3532 7 13.2492 6.97958 13.1497C6.96147 13.0615 6.93151 12.9761 6.89052 12.8958C6.84431 12.8054 6.77934 12.7242 6.64939 12.5617L3.35061 8.43826C3.22066 8.27583 3.15569 8.19461 3.10948 8.10417C3.06849 8.02393 3.03853 7.93852 3.02042 7.85026C3 7.75078 3 7.64677 3 7.43875V5.6C3 5.03995 3 4.75992 3.10899 4.54601C3.20487 4.35785 3.35785 4.20487 3.54601 4.10899C3.75992 4 4.03995 4 4.6 4H13.4C13.9601 4 14.2401 4 14.454 4.10899C14.6422 4.20487 14.7951 4.35785 14.891 4.54601C15 4.75992 15 5.03995 15 5.6V7.43875C15 7.64677 15 7.75078 14.9796 7.85026C14.9615 7.93852 14.9315 8.02393 14.8905 8.10417C14.8443 8.19461 14.7793 8.27583 14.6494 8.43826L11.3506 12.5617C11.2207 12.7242 11.1557 12.8054 11.1095 12.8958C11.0685 12.9761 11.0385 13.0615 11.0204 13.1497C11 13.2492 11 13.3532 11 13.5612V17L7 20Z"
            stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>

      <!-- Offcanvas Panel -->
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasRightLabel">Filter Options</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body">

          <form>

            <div class="mb-3">
              <label for="filterUserId" class="form-label">User ID</label>
              <select id="filterUserId" class="form-select" [(ngModel)]="filter.userId" name="userId">
                <option value="">Select User ID</option>
                <option *ngFor="let id of getUniqueUserIds()" [value]="id">
                  {{ id }}
                </option>
              </select>
            </div>


            <div class="mb-3">
              <label for="filterTenantCode" class="form-label">Tenant Code</label>
              <input type="text" id="filterTenantCode" class="form-control" [(ngModel)]="filter.tenantCode"
                name="tenantCode" />
            </div>


            <div class="mb-3">
              <label for="startDate" class="form-label">Start Date</label>
              <input type="date" id="startDate" class="form-control" [(ngModel)]="filter.startDate" name="startDate" />

              <label for="endDate" class="form-label">End Date</label>
              <input type="date" id="endDate" class="form-control" [(ngModel)]="filter.endDate" name="endDate" />
            </div>


            <!-- Status -->
            <label for="filterStatus" class="form-label">Status</label>
            <select id="filterStatus" class="form-select" [(ngModel)]="filter.status" name="status">
              <option value="">Select Status</option>
              <option *ngFor="let status of statuses" [value]="status.StatusName">
                {{ status.StatusName }}
              </option>
            </select>



            <div class="mb-3">
              <label for="filterAssignedTo" class="form-label">Assign To</label>
              <select id="filterAssignedTo" class="form-select" [(ngModel)]="filter.assignTo" name="assignedTo">
                <option value="">Select User</option>
                <option *ngFor="let issue of issues" [value]="issue.AssignTo">{{ issue.AssignTo }}</option>
              </select>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between">
              <button type="button" class="btn btn-primary mt-2" (click)="applyFilters()">Apply</button>
              <button type="button" class="btn btn-secondary mt-2" (click)="removeFilters()">Clear</button>
            </div>
          </form>
        </div>
      </div>
    </div>


  </div>



  <div class="table-responsive">
    <table class="table table-striped table-bordered table-hover">
      <thead class="table-light">
        <tr>

          <th>user ID</th>
          <th>User</th>
          <th>Issues number</th>
          <th>Tenant Code</th>
          <th>Raised Date</th>
          <th>Status</th>
          <th>Taken Time </th>
          <th>Assig To</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let issue of paginatedIssues">
          <td>
            <button class="btn btn-sm me-2" (click)="editIssue(issue)">{{ issue.UserId }}</button>
          </td>
          <td>{{ issue.Name }}</td>
          <td>{{issue.Issues_Number}}</td>
          <td>{{ issue.TenantCode }}</td>
          <td>{{ issue.Raised_date | date:'yyyy-MM-dd hh:mm:ss a' }}</td>

          <td>{{ issue.StatusName }}</td>
          <td><span>{{ issue.TakenTime | daytime }}</span>
          </td>
          <td>{{ issue.AssignTo }}</td>

          <td>
            <div class="btn-group">
              <!-- edit btn -->
              <button (click)="editIssue(issue)" class="btn btn-sm">

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M20.1498 7.93997L8.27978 19.81C7.21978 20.88 4.04977 21.3699 3.32977 20.6599C2.60977 19.9499 3.11978 16.78 4.17978 15.71L16.0498 3.84C16.5979 3.31801 17.3283 3.03097 18.0851 3.04019C18.842 3.04942 19.5652 3.35418 20.1004 3.88938C20.6356 4.42457 20.9403 5.14781 20.9496 5.90463C20.9588 6.66146 20.6718 7.39189 20.1498 7.93997Z"
                    stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>

              <div class="modal fade" id="exampleModalLong" tabindex="-1" role="dialog"
                aria-labelledby="exampleModalLongTitle" aria-hidden="true">
                <div class="modal-dialog" role="document">
                  <div class="modal-content">

                    <!-- <app-issue></app-issue> -->


                  </div>
                </div>
              </div>
              <button class="btn btn-sm me-2" (click)="openDeleteConfirmation(issue)">
                <!-- Delete SVG icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 7H20" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path
                    d="M6 10L7.70141 19.3578C7.87432 20.3088 8.70258 21 9.66915 21H14.3308C15.2974 21 16.1257 20.3087 16.2986 19.3578L18 10"
                    stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M9 5C9 3.89543 9.89543 3 11 3H13C14.1046 3 15 3.89543 15 5V7H9V5Z" stroke="#000"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <!-- View btn -->
              <button class="btn btn-sm " (click)="viewLog(issue)">
                <svg width="64px" height="64px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                  <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                  <g id="SVGRepo_iconCarrier">
                    <circle cx="12" cy="12" r="3" stroke="#33363F" stroke-width="2"></circle>
                    <path
                      d="M20.188 10.9343C20.5762 11.4056 20.7703 11.6412 20.7703 12C20.7703 12.3588 20.5762 12.5944 20.188 13.0657C18.7679 14.7899 15.6357 18 12 18C8.36427 18 5.23206 14.7899 3.81197 13.0657C3.42381 12.5944 3.22973 12.3588 3.22973 12C3.22973 11.6412 3.42381 11.4056 3.81197 10.9343C5.23206 9.21014 8.36427 6 12 6C15.6357 6 18.7679 9.21014 20.188 10.9343Z"
                      stroke="#33363F" stroke-width="2"></path>
                  </g>
                </svg>
              </button>

            </div>
          </td>
        </tr>
      </tbody>
    </table>

  </div>


  <!-- </div> -->

  <app-view #viewModal></app-view>


  <app-pagination [totalPages]="totalPages" [currentPage]="currentPage" (perPage)="changePer($event)"
    (pageChanged)="changePage($event)">
  </app-pagination>
</div>


<app-issue #IssueComponent></app-issue>

<app-delete-issuse *ngIf="showDeleteModal" (remove_modal)="undoDelete()"
  (delete_issuse)="confirmDeleteIssuse()"></app-delete-issuse>
